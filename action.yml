name: SkillPreflight
description: Pre-install safety, token, and maintainability scorecard for AI agent skills.
author: SkillPreflight contributors
branding:
  icon: shield
  color: green

inputs:
  target:
    description: Local path to scan.
    required: false
    default: "."
  format:
    description: Report format. Use text, json, markdown, html, or sarif.
    required: false
    default: "text"
  out:
    description: Optional file path to write the report.
    required: false
    default: ""
  fail-below:
    description: Fail the workflow if any scanned skill scores below this value. Defaults to 70 when no config is supplied.
    required: false
    default: ""
  fail-on:
    description: Fail for findings at or above this severity.
    required: false
    default: ""
  config:
    description: Optional path to an explicit SkillPreflight JSON policy.
    required: false
    default: ""
  exclude:
    description: Optional newline-separated target-relative path globs.
    required: false
    default: ""
  ignore-rules:
    description: Optional newline-separated rule IDs or wildcard patterns to suppress.
    required: false
    default: ""
  package-version:
    description: npm package version to run.
    required: false
    default: "latest"
  summary:
    description: Show a compact summary instead of full skill details.
    required: false
    default: "false"
  top:
    description: Number of lowest-scoring skills to include in summary mode.
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "20"

    - name: Run SkillPreflight
      shell: bash
      env:
        SKILL_PREFLIGHT_TARGET: ${{ inputs.target }}
        SKILL_PREFLIGHT_FORMAT: ${{ inputs.format }}
        SKILL_PREFLIGHT_OUT: ${{ inputs.out }}
        SKILL_PREFLIGHT_FAIL_BELOW: ${{ inputs.fail-below }}
        SKILL_PREFLIGHT_FAIL_ON: ${{ inputs.fail-on }}
        SKILL_PREFLIGHT_CONFIG: ${{ inputs.config }}
        SKILL_PREFLIGHT_EXCLUDE: ${{ inputs.exclude }}
        SKILL_PREFLIGHT_IGNORE_RULES: ${{ inputs.ignore-rules }}
        SKILL_PREFLIGHT_PACKAGE_VERSION: ${{ inputs.package-version }}
        SKILL_PREFLIGHT_SUMMARY: ${{ inputs.summary }}
        SKILL_PREFLIGHT_TOP: ${{ inputs.top }}
      run: |
        set -euo pipefail
        args=(scan "$SKILL_PREFLIGHT_TARGET" --format "$SKILL_PREFLIGHT_FORMAT")
        if [ -n "$SKILL_PREFLIGHT_FAIL_BELOW" ]; then
          args+=(--fail-below "$SKILL_PREFLIGHT_FAIL_BELOW")
        elif [ -z "$SKILL_PREFLIGHT_CONFIG" ]; then
          args+=(--fail-below "70")
        fi
        if [ -n "$SKILL_PREFLIGHT_FAIL_ON" ]; then
          args+=(--fail-on "$SKILL_PREFLIGHT_FAIL_ON")
        fi
        if [ -n "$SKILL_PREFLIGHT_CONFIG" ]; then
          args+=(--config "$SKILL_PREFLIGHT_CONFIG")
        fi
        if [ -n "$SKILL_PREFLIGHT_OUT" ]; then
          args+=(--out "$SKILL_PREFLIGHT_OUT")
        fi
        while IFS= read -r pattern; do
          if [ -n "$pattern" ]; then
            args+=(--exclude "$pattern")
          fi
        done <<< "$SKILL_PREFLIGHT_EXCLUDE"
        while IFS= read -r rule_id; do
          if [ -n "$rule_id" ]; then
            args+=(--ignore-rule "$rule_id")
          fi
        done <<< "$SKILL_PREFLIGHT_IGNORE_RULES"
        if [ "$SKILL_PREFLIGHT_SUMMARY" = "true" ]; then
          args+=(--summary --top "$SKILL_PREFLIGHT_TOP")
        fi
        npx -y "skill-preflight@$SKILL_PREFLIGHT_PACKAGE_VERSION" "${args[@]}"
